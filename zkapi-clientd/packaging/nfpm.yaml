name: zkapi-clientd
arch: ${OA_PACKAGE_ARCH}
platform: linux
version: ${OA_PACKAGE_VERSION}
maintainer: Open Anonymity <contact@openanonymity.ai>
vendor: Open Anonymity
homepage: https://github.com/OpenAnonymity/zkapi
description: Local OpenAI-compatible API with private prepaid zkAPI access
license: MIT
section: net
priority: optional
depends:
  - ca-certificates
recommends:
  - systemd
contents:
  - src: ${OA_PACKAGE_STAGE}/zkapi-clientd
    dst: /usr/bin/zkapi-clientd
    expand: true
    file_info:
      mode: 0755
  - src: ${OA_PACKAGE_STAGE}/zkapi-walletd
    dst: /usr/bin/zkapi-walletd
    expand: true
    file_info:
      mode: 0755
  - src: ${OA_PACKAGE_STAGE}/share/zkapi-clientd/
    dst: /usr/share/zkapi-clientd
    type: tree
    expand: true
  - src: zkapi-clientd/packaging/systemd/zkapi-clientd.service
    dst: /usr/lib/systemd/user/zkapi-clientd.service
    file_info:
      mode: 0644
  - src: zkapi-clientd/LICENSE
    dst: /usr/share/licenses/zkapi-clientd/LICENSE
    file_info:
      mode: 0644
  - src: zkapi-clientd/docs/CLI_PACKAGING.md
    dst: /usr/share/doc/zkapi-clientd/CLI_PACKAGING.md
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - ca-certificates
      - libc6 (>= 2.39)
      - libgcc-s1
      - libssl3 | libssl3t64
  rpm:
    depends:
      - ca-certificates
      - glibc >= 2.39
      - libgcc
      - openssl-libs
